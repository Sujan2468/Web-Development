<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card </title>
    <link href="style.css" type="text/css" rel="stylesheet" />
</head>
<body>
    <div id="wrapper">
        <div class="card-info">
            <img src="webdev.jpg" alt="card image" />
            <h2>Web Development Master Course @dot Batch</h2>
        </div>
        <hr />
        <div class="product-price">
            <span class="price" id="unstrike">&#8377<b>4500</b></span>
            <span class="price" id="strike">&#8377<b>6999</b></span>
            <span class="discount">42% off</span>
        </div>
    </div>
</body>
</html>
